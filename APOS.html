<strong>The Game, A Puzzle of Sorts</strong>
<strong>The point of the game is as-like Sokoban (push-block to target), but with modifications. I made this all on my own.</strong>
<br><button class="button8"><strong>A Puzzle of Sorts, How to Play:</strong></button>
<button class="button8"><strong>Use the arrow keys or WASD to move, push crates onto their respective target—the tutorial shows which crates go to which targets—and once all crates are on the targets, go to the Goal Flag.</strong></button>
<button class="button8"><strong>Or if you want to play it on itch.io, here is the link!</strong></button>

<script>


function loadItchEmbed() {
	
	let x = document.createElement("IFRAME");
	x.setAttribute("src","https://itch.io/embed-upload/15538073?color=0484d1");
	x.setAttribute("allow","fullscreen");
	x.setAttribute("width","400px");
	x.setAttribute("height","200px");
	x.setAttribute("name","A Puzzle of Sorts by Sir_Kirby!");
	x.setAttribute("allowfullscreen", "");
	document.body.appendChild(x);
}

function loadPuzzleScriptEmbed() {
	let x = document.createElement("IFRAME");
	x.setAttribute("src","APuzzleOfSortsv0-5-1.html");
	x.setAttribute("allow","fullscreen");
	x.setAttribute("resize","both");
	x.setAttribute("width","400px");
	x.setAttribute("height","200px");
	x.setAttribute("name","A Puzzle of Sorts by Sir_Kirby!");
	x.setAttribute("id", "puzzlescript-iframe");
	document.body.appendChild(x);
	// Show the fullscreen button
	document.getElementById('fullscreen-ps-btn').style.display = '';
}

function fullscreenPuzzleScript() {
	var iframe = document.getElementById("puzzlescript-iframe");
	if (iframe) {
		if (iframe.requestFullscreen) {
			iframe.requestFullscreen();
		} else if (iframe.mozRequestFullScreen) {
			iframe.mozRequestFullScreen();
		} else if (iframe.webkitRequestFullscreen) {
			iframe.webkitRequestFullscreen();
		} else if (iframe.msRequestFullscreen) {
			iframe.msRequestFullscreen();
		}
	}
}



</script>
